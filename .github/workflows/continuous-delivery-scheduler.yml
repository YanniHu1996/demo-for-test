name: continuous-delivery-scheduler
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  generate-workflows:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Generate Matrix
        id: generate
        run: |
          matrix=$(cat .github/operand_versions_scope.json | jq -rc '{"pgd_edition": .supported}')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          echo ${matrix}

  continuous-delivery:
    name: PGD${{ matrix.pgd_edition }}
    needs:
      - generate-workflows
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-workflows.outputs.matrix) }}
    uses: ./.github/workflows/continuous-delivery.yml
    with:
      depth: schedule
      pgd_edition: ${{ matrix.pgd_edition }}

  continuous-delivery-2:
    name: Trigger E2E For ${{ matrix.pgd_edition }}
    runs-on: ubuntu-latest
    needs:
      - generate-workflows
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-workflows.outputs.matrix) }}
    steps:
      - name: Invoke continuous delivery
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Another Workflow
          inputs: '{ "pgd_edition": "${{ matrix.pgd_edition }}", "depth": "schedule" }'

      - name: upload workflowId to github action summary
        run: |
          echo "workflowId: ${{ steps.invoke.outputs.workflow_id }}" >> $GITHUB_ENV
          echo "workflowId: ${{ steps.invoke.outputs.workflow_id }}"
          echo "workflowId: ${{ steps.invoke.outputs.workflow_id }}" >> $GITHUB_STEP_SUMMARY
          echo "workflowId: ${{ steps.invoke.outputs.workflow_id }}"
