name: continuous-delivery-scheduler
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  generate-workflows:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Generate Matrix
        id: generate
        run: |
          matrix=$(cat .github/operand_versions_scope.json | jq -rc '{"pgd_edition": .supported, "name": ["5", "6s", "6x"]}')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          echo ${matrix}

  test:
    runs-on: ubuntu-latest
    needs:
      - generate-workflows

  continuous-delivery:
    name: Continuous Delivery ${{ matrix.name }}
    needs:
      - generate-workflows
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-workflows.outputs.matrix) }}
    uses: ./.github/workflows/continuous-delivery.yml
    with:
      depth: schedule
      pgd_edition: ${{ matrix.pgd_edition }}
